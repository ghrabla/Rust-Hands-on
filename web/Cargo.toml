[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.19"
anyhow = "1.0.104"
async-trait = "0.1"
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
mongodb = "3"

